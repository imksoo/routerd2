# The example LAN address range is for a dedicated test router namespace.
schema_version: 2
resources:
  - id: address/eth0/b3a5eaa2139857300294470e
    depends_on:
      - interface/eth0
    address:
      interface: eth0
      cidr: 192.0.2.1/24
  - id: interface/eth0
    interface:
      name: eth0
  - id: service/leases
    depends_on:
      - interface/eth0
    service:
      dhcp_server:
        interface: eth0
        server_address: 192.0.2.1
        primary:
          name: ""
          prefix: 192.0.2.0/24
          start: 192.0.2.50
          end: 192.0.2.200
          lease_seconds: 3600
          router: 192.0.2.1
          dns_servers:
            - 192.0.2.1
          domain: lab.example
          match: {}
        authoritative: true
        max_leases: 200
      name: leases
  - id: service/resolver
    service:
      name: resolver
      dns:
        resource: ""
        spec:
          listen:
            - name: lan
              addresses:
                - 192.0.2.1
                - 127.0.0.1
              port: 53
          sources:
            - name: local
              kind: zone
              match:
                - lab.example
              zoneRef:
                - DNSZone/lan
              healthcheck: {}
          cache: {}
          metrics: {}
          queryLog: {}
          when: {}
        zones:
          - name: lan
            spec:
              zone: lab.example
              dnssec: {}
              records:
                - hostname: router
                  ipv4: 192.0.2.1
                  ipv4From:
                    resource: ""
                  ipv6From:
                    resource: ""
              dhcpDerived:
                sources:
                  - DHCPv4Server/leases
