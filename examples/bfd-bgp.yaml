# Documentation prefixes and private ASNs. Replace addresses and interface.
# Both ends need matching single-hop BFD and BGP configuration.
schema_version: 2
resources:
  - id: address/eth0/13a2d17797cb46e73b5d2e53
    depends_on:
      - interface/eth0
    address:
      interface: eth0
      cidr: 192.0.2.2/24
  - id: forwarding
    forwarding:
      ipv4: true
  - id: interface/eth0
    interface:
      name: eth0
  - id: service/edge-bfd
    depends_on:
      - interface/eth0
    service:
      bfd:
        resource: ""
        interface: eth0
        source_address: 192.0.2.2
        peers:
          - address: 192.0.2.1
            min_tx_milliseconds: 300
            min_rx_milliseconds: 300
            detect_multiplier: 3
      name: edge-bfd
  - id: service/edge-bgp
    service:
      bgp:
        runtime:
          version: 1
          global:
            asn: 65002
            routerID: 192.0.2.2
            listenPort: 179
            families:
              - ipv4-unicast
            useMultiplePaths: false
            importPolicy: {}
          peers:
            192.0.2.1:
              address: 192.0.2.1
              asn: 65001
              importPolicy:
                allowedPrefixes:
                  - 198.51.100.0/24
              exportPolicy: {}
        peer_transports:
          192.0.2.1:
            local_address: 192.0.2.2
            bind_interface: eth0
        peer_bfd:
          192.0.2.1:
            service: edge-bfd
        fib_interface: eth0
      name: edge-bgp
