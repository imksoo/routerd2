    name: flows
    traffic_flow:
      application_layer: true
      packet_group: 2
      retention:
        max_age_seconds: 604800
        interval_seconds: 86400
        vacuum: true
- id: service/packets
  service:
    name: packets
    firewall_log:
      group: 1
      retention:
        max_age_seconds: 604800
        interval_seconds: 86400
        vacuum: true
- id: interface/sync0
