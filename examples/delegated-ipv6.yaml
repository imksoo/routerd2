# This acquires IA_PD, allocates a LAN /64 and advertises it with finite lifetimes.
# WAN global addressing/default-router learning must be configured separately.
schema_version: 2
resources:
  - id: firewall
    firewall:
      forward:
        - from: eth1
          to: eth0
  - id: forwarding
    forwarding:
      ipv6: true
  - id: interface/eth0
    interface:
      name: eth0
  - id: interface/eth1
    interface:
      name: eth1
  - id: service/uplink-pd
    depends_on:
      - interface/eth0
      - interface/eth1
    service:
      name: uplink-pd
      dhcp6:
        request_prefix: true
        interface: eth0
        iaid: 1
        prefix_length: 56
        delegations:
          - name: lan
            interface: eth1
            subnet_id: 1
            host_id: 1
  - id: service/lan-ra
    depends_on: [service/uplink-pd]
    service:
      name: lan-ra
      ra:
        interface: eth1
        router_lifetime_seconds: 1800
        from:
          service: uplink-pd
          delegation: lan
          use_learned_rdnss: true
          use_learned_dnssl: true
