# Interface names are examples. Apply within the target router namespace.
schema_version: 1
network:
  links:
    - name: br-lan
      kind: bridge
      bridge_multicast_snooping: false
  interfaces:
    - name: eth0
    - name: eth1
      master: br-lan
    - name: br-lan
      addresses: [192.168.10.1/24]
  forwarding:
    ipv4: true
  firewall:
    forward:
      - {from: br-lan, to: eth0}
    masquerade:
      - {source: 192.168.10.0/24, out_interface: eth0}
services:
  - name: wan
    dhcp4:
      interface: eth0
      hostname: routerd2
      default_route: true
      metric: 100
  - name: resolver
    dns:
      spec:
        listen:
          - name: lan
            addresses: [192.168.10.1, 127.0.0.1]
            port: 53
        sources:
          - name: upstream
            kind: forward
            match: ['.']
            upstreams: ['udp://9.9.9.9:53']
