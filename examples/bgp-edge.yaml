# Documentation prefixes and private ASNs: replace them for your environment.
schema_version: 2
resources:
  - id: address/eth0/13a2d17797cb46e73b5d2e53
    depends_on:
      - interface/eth0
    address:
      interface: eth0
      cidr: 192.0.2.2/24
  - id: forwarding
    forwarding:
      ipv4: true
  - id: interface/eth0
    interface:
      name: eth0
  - id: service/edge-bgp
    service:
      bgp:
        runtime:
          version: 1
          global:
            asn: 65002
            routerID: 192.0.2.2
            listenPort: 179
            families:
              - ipv4-unicast
            useMultiplePaths: false
            importPolicy: {}
          peers:
            192.0.2.1:
              address: 192.0.2.1
              asn: 65001
              importPolicy:
                allowedPrefixes:
                  - 198.51.100.0/24
              exportPolicy: {}
        fib_interface: eth0
        table: 254
        route_metric: 200
        max_routes: 4096
      name: edge-bgp
