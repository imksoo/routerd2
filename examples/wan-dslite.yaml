# Replace wan0/lan0 with the appliance's actual interfaces before use.
# This illustrates RA + DHCPv6 Information-request + DS-Lite B4. It is not a
# captured homert02/03 configuration and makes no provider-specific assumptions.
schema_version: 2
resources:
  - id: address/lan0/b3a5eaa2139857300294470e
    depends_on:
      - interface/lan0
    address:
      interface: lan0
      cidr: 192.0.2.1/24
  - id: firewall
    firewall:
      forward:
        - from: lan0
          to: dslite0
  - id: forwarding
    forwarding:
      ipv4: true
      ipv6: true
  - id: interface/lan0
    interface:
      name: lan0
  - id: interface/wan0
    interface:
      name: wan0
  - id: service/internet
    depends_on:
      - interface/wan0
    service:
      ds_lite:
        interface: wan0
        tunnel: dslite0
        source_from: wan-ra
        aftr_from: wan-info
        dns_from:
          - wan-info
          - wan-ra
        selection: first
        b4_address: 192.0.0.2/32
        default_route: true
        metric: 200
      name: internet
  - id: service/wan-info
    depends_on:
      - interface/wan0
    service:
      name: wan-info
      dhcp6:
        interface: wan0
        iaid: 1
        information_only: true
  - id: service/wan-ra
    depends_on:
      - interface/wan0
    service:
      ra_client:
        interface: wan0
        slaac: true
        default_route: true
        on_link: true
        route_information: true
        dns: true
      name: wan-ra
