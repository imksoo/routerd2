# Homert's common single-router path for isolated native-profile acceptance.
# 198.18.0.0/24 is reserved for benchmark networks; never use it on a site LAN.
# NTT HGWs commonly omit the DHCPv6 AFTR option; this AFTR matches homert's
# explicit routerd configuration. Replace interfaces, LAN values and DNS peers before deployment.
# SSH is configured separately in the boot file; use the management address,
# port 2222 and operator authorized_keys to match this profile's input policy.
schema_version: 2
resources:
  - id: interface/wan0
    interface: {name: wan0, ipv4_rp_filter: 0}
  - id: interface/lan0
    interface: {name: lan0}
  - id: interface/mgmt0
    interface: {name: mgmt0}
  - id: interface/bgp0
    interface: {name: bgp0}
  - id: address/bgp
    depends_on: [interface/bgp0]
    address: {interface: bgp0, cidr: 192.0.2.1/24}
  - id: interface/peer0
    interface: {name: peer0}
  - id: address/tailnet-underlay
    depends_on: [interface/peer0]
    address: {interface: peer0, cidr: 198.51.100.2/24}
  - id: address/management
    depends_on: [interface/mgmt0]
    address: {interface: mgmt0, cidr: 198.19.0.1/24}
  - id: address/lan
    depends_on: [interface/lan0]
    address: {interface: lan0, cidr: 198.18.0.1/24}
  - id: forwarding
    forwarding: {ipv4: true, ipv6: true, ipv4_rp_filter: 0, conntrack_tcp_liberal: true}
  - id: firewall
    firewall:
      input:
        policy: accept
        rules:
          - {match: {in_interface: mgmt0, source: 198.19.0.0/24, protocol: tcp, destination_ports: [{start: 2222}, {start: 8080}]}, action: accept}
          - {match: {protocol: tcp, destination_ports: [{start: 2222}, {start: 8080}]}, action: drop}
          - {match: {in_interface: wan0, protocol: udp, destination_ports: [{start: 53}]}, action: drop}
          - {match: {in_interface: wan0, protocol: tcp, destination_ports: [{start: 53}]}, action: drop}
      forward:
        - {from: tailscale0, to: lan0}
        - {from: tailscale0, to: dslite0}
        - {from: tailscale0, to: wan0}
        - {from: lan0, to: tailscale0}
        - {from: lan0, to: bgp0}
        - {from: bgp0, to: lan0}
        - {from: lan0, to: dslite0}
        - {from: lan0, to: dslite1}
        - {from: lan0, to: dslite2}
        - {from: lan0, to: dslite3}
        - {from: lan0, to: wan0}
      mss_clamp:
        - {from: lan0, to: dslite1, family: 4, mtu: 1454}
        - {from: dslite1, to: lan0, family: 4, mtu: 1454}
        - {from: lan0, to: dslite2, family: 4, mtu: 1454}
        - {from: dslite2, to: lan0, family: 4, mtu: 1454}
        - {from: lan0, to: dslite3, family: 4, mtu: 1454}
        - {from: dslite3, to: lan0, family: 4, mtu: 1454}
        - {from: lan0, to: dslite0, family: 4, mtu: 1454}
        - {from: dslite0, to: lan0, family: 4, mtu: 1454}
        - {from: lan0, to: wan0, family: 6, mtu: 1500}
        - {from: wan0, to: lan0, family: 6, mtu: 1500}
      ipv4_clear_df:
        - {from: lan0, to: dslite1}
        - {from: lan0, to: dslite2}
        - {from: lan0, to: dslite3}
        - {from: lan0, to: dslite0}
  - id: lan-dslite-nat
    nat:
      - type: masquerade
        match: {family: 4, source: 198.18.0.0/24, out_interface: dslite0}
      - type: masquerade
        match: {family: 4, source: 100.64.0.0/10, out_interface: dslite0}
      - type: masquerade
        match: {family: 6, source: fd7a:115c:a1e0::/48, out_interface: wan0}
      - type: masquerade
        match: {family: 6, in_interface: lan0, out_interface: tailscale0}
      - type: masquerade
        match: {family: 4, source: 198.18.0.0/24, out_interface: dslite1}
      - type: masquerade
        match: {family: 4, source: 198.18.0.0/24, out_interface: dslite2}
      - type: masquerade
        match: {family: 4, source: 198.18.0.0/24, out_interface: dslite3}
  - id: service/wan4
    depends_on: [interface/wan0]
    service:
      name: wan4
      dhcp4:
        interface: wan0
        hostname: routerd2
        default_route: false
  - id: service/wan-ra
    depends_on: [interface/wan0]
    service:
      name: wan-ra
      ra_client:
        interface: wan0
        slaac: true
        default_route: true
        on_link: true
        route_information: true
        dns: true
  - id: service/wan-pd
    depends_on: [interface/wan0, interface/lan0]
    service:
      name: wan-pd
      dhcp6:
        interface: wan0
        iaid: 1
        request_prefix: true
        prefix_length: 60
        delegations:
          - {name: lan, interface: lan0, host_id: 1}
          - {name: b4-source, interface: wan0, host_id: 33, prefix_length: 128}
          - {name: b4-source1, interface: wan0, host_id: 34, prefix_length: 128}
          - {name: b4-source2, interface: wan0, host_id: 19, prefix_length: 128}
          - {name: b4-source3, interface: wan0, host_id: 35, prefix_length: 128}
  - id: service/lan-ra
    depends_on: [service/wan-pd]
    service:
      name: lan-ra
      ra:
        interface: lan0
        managed: false
        other_config: true
        router_lifetime_seconds: 1800
        from:
          service: wan-pd
          delegation: lan
          rdnss_router: true
        dnssl: [home.arpa]
  - id: service/lan-info
    depends_on: [service/wan-pd]
    service:
      name: lan-info
      dhcp6_server:
        interface: lan0
        dns_delegation: {service: wan-pd, delegation: lan}
        domain_search: [home.arpa]
        refresh_seconds: 1800
  - id: service/lan-leases
    depends_on: [interface/lan0, address/lan]
    service:
      name: lan-leases
      dhcp_server:
        interface: lan0
        server_address: 198.18.0.1
        primary:
          prefix: 198.18.0.0/24
          start: 198.18.0.64
          end: 198.18.0.191
          lease_seconds: 43200
          router: 198.18.0.1
          dns_servers: [198.18.0.1]
          domain: home.arpa
        authoritative: true
        max_leases: 200
        scopes:
          - name: special-devices
            match: {ouiPrefixes: ["02:00:00"]}
            prefix: 198.18.0.0/24
            start: 198.18.0.32
            end: 198.18.0.63
            lease_seconds: 43200
            router: 198.18.0.1
            dns_servers: [198.18.0.1]
            domain: home.arpa
        reservations:
          - {mac_address: "02:00:00:00:00:01", hostname: printer, ip_address: 198.18.0.10}
          - {mac_address: "02:00:00:00:00:02", hostname: storage, ip_address: 198.18.0.11}
  - id: service/internet
    depends_on: [interface/wan0]
    ready_when: {fact: service.internet.active}
    service:
      name: internet
      ds_lite:
        interface: wan0
        tunnel: dslite0
        source_from: wan-pd
        source_delegation: b4-source
        candidates: [2404:8e00::feed:100]
        mtu: 1454
        b4_address: 192.0.0.2/32
        default_route: true
        metric: 200
  - id: host-wan
    depends_on: [service/wan-ra]
    host_route:
      interface: wan0
      router_from: service.wan-ra
      table: 120
      priority: 10120
      bypasses:
        - {service: service.internet, priority: 10100}
        - {service: service.internet1, priority: 10101}
        - {service: service.internet2, priority: 10102}
        - {service: service.internet3, priority: 10103}
  - id: service/dns
    depends_on: [interface/lan0, address/lan, address/management, host-wan]
    service:
      name: dns
      dns:
        spec:
          cache: {enabled: true, maxEntries: 10000, minTTL: 60s, maxTTL: 24h, negativeTTL: 30s}
          queryLog: {enabled: true}
          listen:
            - {name: loopback, addresses: [127.0.0.1], port: 53}
            - name: management
              addressFrom: [{resource: Interface/mgmt0, field: ipv4Addresses}]
              port: 53
            - {name: lan-v4, addresses: [198.18.0.1], port: 53}
            - name: lan-v6
              addressFrom:
                - {resource: IPv6DelegatedAddress/wan-pd/lan}
              port: 53
          sources:
            - name: local
              kind: zone
              match: [home.arpa]
              zoneRef: [home]
            - name: branch-forwarder
              kind: forward
              match: [branch.split.test, corp.test]
              upstreams: [udp://198.18.0.254:5354]
            - name: wan-learned
              kind: forward
              match: [example.net]
              upstreamFrom:
                - {resource: DHCPv6PrefixDelegation/wan-pd, field: dnsServers}
            - name: site-forwarder
              kind: forward
              match: [split.test]
              upstreams: [udp://198.18.0.254:5353, udp://198.18.0.254:5354]
            - name: encrypted-public
              kind: forward
              match: ["."]
              upstreams: [https://cloudflare-dns.com/dns-query, https://dns.google/dns-query]
              queryTimeout: 1s
              healthcheck: {interval: 15s, timeout: 3s, failThreshold: 3, passThreshold: 2}
              bootstrapResolver: [1.1.1.1, 8.8.8.8]
              bootstrapResolverFrom:
                - {resource: DHCPv6PrefixDelegation/wan-pd, field: dnsServers}
        zones:
          - name: home
            spec:
              zone: home.arpa
              records:
                - hostname: router
                  ipv4: 198.18.0.1
                  ipv6From: {resource: IPv6DelegatedAddress/wan-pd/lan, field: address}
              dhcpDerived:
                sources: [DHCPv4Server/lan-leases]
  - id: service/time
    depends_on: [address/lan]
    service:
      name: time
      ntp:
        sources:
          - sources_from: [wan-pd]
            servers: [{address: 198.18.0.254}]
        listen: [198.18.0.1]
        allow: [198.18.0.0/24]
  - id: service/console
    depends_on: [address/management]
    service:
      name: console
      web_console: {listen: "198.19.0.1:8080", title: routerd2}
  - id: service/routing
    depends_on: [address/bgp, address/lan]
    service:
      name: routing
      bgp:
        runtime:
          version: 1
          global:
            asn: 64500
            routerID: 192.0.2.1
            listenAddresses: [192.0.2.1]
            listenPort: 179
            families: [ipv4-unicast]
            importPolicy: {allowedPrefixes: [203.0.113.0/24], nextHopRewrite: peer-address}
            gracefulRestart: {enabled: true, restartTime: 120, staleRoutesTime: 360}
          peers:
            192.0.2.2:
              address: 192.0.2.2
              asn: 64512
              importPolicy: {allowedPrefixes: [203.0.113.0/24], nextHopRewrite: peer-address}
              exportPolicyName: lan
              exportPolicy: {allowedPrefixes: [198.18.0.0/24]}
          paths:
            - {source: routerd-static, prefix: 198.18.0.0/24}
        bind_interface: bgp0
        fib_interface: bgp0
  - id: service/tailnet
    depends_on: [address/tailnet-underlay, address/lan]
    service:
      name: tailnet
      tailscale:
        interface: tailscale0
        server_url: https://198.51.100.1:8443
        hostname: hgw-router
        auth_key_file: /run/routerd-uplink/tailscale.key
        advertise_routes: [198.18.0.0/24]
        advertise_exit_node: true
  - id: service/internet1
    depends_on: [interface/wan0]
    ready_when: {fact: service.internet1.active}
    service:
      name: internet1
      ds_lite:
        interface: wan0
        tunnel: dslite1
        source_from: wan-pd
        source_delegation: b4-source1
        candidates: [2404:8e00::feed:101]
        mtu: 1454
        b4_address: 192.0.0.2/32
        default_route: true
        metric: 201
  - id: service/internet2
    depends_on: [interface/wan0]
    ready_when: {fact: service.internet2.active}
    service:
      name: internet2
      ds_lite:
        interface: wan0
        tunnel: dslite2
        source_from: wan-pd
        source_delegation: b4-source2
        candidates: [2404:8e00::feed:102]
        mtu: 1454
        b4_address: 192.0.0.2/32
        default_route: true
        metric: 202
  - id: service/internet3
    depends_on: [interface/wan0]
    ready_when: {fact: service.internet3.active}
    service:
      name: internet3
      ds_lite:
        interface: wan0
        tunnel: dslite3
        source_from: wan-pd
        source_delegation: b4-source3
        candidates: [2404:8e00::feed:100]
        mtu: 1454
        b4_address: 192.0.0.2/32
        default_route: true
        metric: 203
