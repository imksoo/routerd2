# Homert's common single-router path for isolated native-profile acceptance.
# 198.18.0.0/24 is reserved for benchmark networks; never use it on a site LAN.
# NTT HGWs commonly omit the DHCPv6 AFTR option; this AFTR matches homert's
# explicit routerd configuration. Replace interfaces, LAN values and DNS peers before deployment.
# SSH is configured separately in the boot file; use the management address,
# port 2222 and operator authorized_keys to match this profile's input policy.
schema_version: 2
resources:
  - id: interface/wan0
    interface: {name: wan0, ipv4_rp_filter: 0}
  - id: interface/lan0
    interface: {name: lan0}
  - id: interface/mgmt0
    interface: {name: mgmt0}
  - id: address/management
    depends_on: [interface/mgmt0]
    address: {interface: mgmt0, cidr: 198.19.0.1/24}
  - id: address/lan
    depends_on: [interface/lan0]
    address: {interface: lan0, cidr: 198.18.0.1/24}
  - id: forwarding
    forwarding: {ipv4: true, ipv6: true, ipv4_rp_filter: 0, conntrack_tcp_liberal: true}
  - id: firewall
    firewall:
      input:
        policy: accept
        rules:
          - {match: {in_interface: mgmt0, source: 198.19.0.0/24, protocol: tcp, destination_ports: [{start: 2222}, {start: 8080}]}, action: accept}
          - {match: {protocol: tcp, destination_ports: [{start: 2222}, {start: 8080}]}, action: drop}
          - {match: {in_interface: wan0, protocol: udp, destination_ports: [{start: 53}]}, action: drop}
          - {match: {in_interface: wan0, protocol: tcp, destination_ports: [{start: 53}]}, action: drop}
      forward:
        - {from: lan0, to: dslite0}
        - {from: lan0, to: wan0}
      mss_clamp:
        - {from: lan0, to: dslite0, family: 4, mtu: 1454}
        - {from: dslite0, to: lan0, family: 4, mtu: 1454}
        - {from: lan0, to: wan0, family: 6, mtu: 1500}
        - {from: wan0, to: lan0, family: 6, mtu: 1500}
      ipv4_clear_df:
        - {from: lan0, to: dslite0}
  - id: lan-dslite-nat
    nat:
      - type: masquerade
        match: {family: 4, source: 198.18.0.0/24, out_interface: dslite0}
  - id: service/wan4
    depends_on: [interface/wan0]
    service:
      name: wan4
      dhcp4:
        interface: wan0
        hostname: routerd2
        default_route: false
  - id: service/wan-ra
    depends_on: [interface/wan0]
    service:
      name: wan-ra
      ra_client:
        interface: wan0
        slaac: true
        default_route: true
        on_link: true
        route_information: true
        dns: true
  - id: service/wan-pd
    depends_on: [interface/wan0, interface/lan0]
    service:
      name: wan-pd
      dhcp6:
        interface: wan0
        iaid: 1
        request_prefix: true
        prefix_length: 60
        delegations:
          - {name: lan, interface: lan0, host_id: 1}
          - {name: b4-source, interface: wan0, host_id: 33, prefix_length: 128}
  - id: service/lan-ra
    depends_on: [service/wan-pd]
    service:
      name: lan-ra
      ra:
        interface: lan0
        managed: false
        other_config: true
        router_lifetime_seconds: 1800
        from:
          service: wan-pd
          delegation: lan
          rdnss_router: true
        dnssl: [home.arpa]
  - id: service/lan-info
    depends_on: [service/wan-pd]
    service:
      name: lan-info
      dhcp6_server:
        interface: lan0
        dns_delegation: {service: wan-pd, delegation: lan}
        domain_search: [home.arpa]
        refresh_seconds: 1800
  - id: service/lan-leases
    depends_on: [interface/lan0, address/lan]
    service:
      name: lan-leases
      dhcp_server:
        interface: lan0
        server_address: 198.18.0.1
        primary:
          prefix: 198.18.0.0/24
          start: 198.18.0.64
          end: 198.18.0.191
          lease_seconds: 43200
          router: 198.18.0.1
          dns_servers: [198.18.0.1]
          domain: home.arpa
        authoritative: true
        max_leases: 200
        scopes:
          - name: special-devices
            match: {ouiPrefixes: ["02:00:00"]}
            prefix: 198.18.0.0/24
            start: 198.18.0.32
            end: 198.18.0.63
            lease_seconds: 43200
            router: 198.18.0.1
            dns_servers: [198.18.0.1]
            domain: home.arpa
        reservations:
          - {mac_address: "02:00:00:00:00:01", hostname: printer, ip_address: 198.18.0.10}
          - {mac_address: "02:00:00:00:00:02", hostname: storage, ip_address: 198.18.0.11}
  - id: service/internet
    depends_on: [interface/wan0]
    ready_when: {fact: service.internet.active}
    service:
      name: internet
      ds_lite:
        interface: wan0
        tunnel: dslite0
        source_from: wan-pd
        source_delegation: b4-source
        candidates: [2404:8e00::feed:100]
        mtu: 1454
        b4_address: 192.0.0.2/32
        b4_peer: 192.0.0.1/32
        route_gateway: 192.0.0.1
        default_route: true
        metric: 200
  - id: host-wan
    depends_on: [service/wan-ra]
    host_route:
      interface: wan0
      router_from: service.wan-ra
      table: 120
      priority: 10120
      bypasses:
        - {service: service.internet, priority: 10100}
  - id: service/dns
    depends_on: [interface/lan0, address/lan, address/management, host-wan]
    service:
      name: dns
      dns:
        spec:
          cache: {enabled: true, maxEntries: 10000, minTTL: 60s, maxTTL: 24h, negativeTTL: 30s}
          queryLog: {enabled: true}
          listen:
            - {name: loopback, addresses: [127.0.0.1], port: 53}
            - name: management
              addressFrom: [{resource: Interface/mgmt0, field: ipv4Addresses}]
              port: 53
            - {name: lan-v4, addresses: [198.18.0.1], port: 53}
            - name: lan-v6
              addressFrom:
                - {resource: IPv6DelegatedAddress/wan-pd/lan}
              port: 53
          sources:
            - name: local
              kind: zone
              match: [home.arpa]
              zoneRef: [home]
            - name: site-forwarder
              kind: forward
              match: [split.test]
              upstreams: [udp://198.18.0.254:5353]
            - name: encrypted-public
              kind: forward
              match: ["."]
              upstreams: [https://cloudflare-dns.com/dns-query]
              bootstrapResolverFrom:
                - {resource: DHCPv6PrefixDelegation/wan-pd, field: dnsServers}
        zones:
          - name: home
            spec:
              zone: home.arpa
              records:
                - hostname: router
                  ipv4: 198.18.0.1
                  ipv6From: {resource: IPv6DelegatedAddress/wan-pd/lan, field: address}
              dhcpDerived:
                sources: [DHCPv4Server/lan-leases]
  - id: service/time
    depends_on: [address/lan]
    service:
      name: time
      ntp:
        sources:
          - sources_from: [wan-pd]
            servers: [{address: 198.18.0.254}]
        listen: [198.18.0.1]
        allow: [198.18.0.0/24]
  - id: service/console
    depends_on: [address/management]
    service:
      name: console
      web_console: {listen: "198.19.0.1:8080", title: routerd2}
