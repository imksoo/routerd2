# Example routed site-to-site link. Replace all interface names, addresses and
# the peer public key with the intended deployment's values before applying.
# The example public key is a placeholder, not an enrolled remote peer.
schema_version: 1
network:
  links:
    - name: wg0
      kind: wireguard
  interfaces:
    - name: wan0
      addresses: [192.0.2.2/24]
    - name: lan0
      addresses: [10.10.1.1/24]
    - name: wg0
      mtu: 1420
      addresses: [10.255.0.1/32]
  wireguard:
    - interface: wg0
      # The existing state directory must be private and persistent. On first
      # apply, routerd can generate the key here without a shell or wg utility.
      private_key_file: /var/lib/routerd/wg0-v1.key
      generate_private_key: true
      listen_port: 51820
      peers:
        - public_key: QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI=
          endpoint: 198.51.100.2:51820
          allowed_ips: [10.255.0.2/32, 10.10.2.0/24]
          persistent_keepalive: 25
  routes:
    - destination: 0.0.0.0/0
      gateway: 192.0.2.1
      interface: wan0
    - destination: 10.255.0.2/32
      interface: wg0
    - destination: 10.10.2.0/24
      interface: wg0
  forwarding:
    ipv4: true
  firewall:
    input:
      policy: drop
      rules:
        - match: {in_interface: lo}
          action: accept
        - match:
            in_interface: wan0
            protocol: udp
            destination_ports: [{start: 51820}]
          action: accept
        - match:
            in_interface: lan0
            source: 10.10.1.0/24
            protocol: tcp
            destination_ports: [{start: 22}]
          action: accept
        - match: {protocol: icmp}
          action: accept
        - match: {protocol: icmpv6}
          action: accept
    forward:
      - {from: lan0, to: wg0}
      - {from: wg0, to: lan0}
