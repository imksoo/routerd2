name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Format, test, race detector, and vet
        run: make check
      - name: Static Linux builds
        run: make build-linux RELEASE_ID="${GITHUB_SHA}"
      - name: Signed release bundles from actual amd64 and arm64 binary pairs
        run: make release-built-test RELEASE_ID="${GITHUB_SHA}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            dist/bin/
            dist/licenses/
          if-no-files-found: error

  images:
    needs: go
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - uses: docker/setup-buildx-action@v3
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-system-x86 openssh-client e2fsprogs
      - name: Build and exercise the scratch container
        run: make container-smoke CONTAINER_TAG=routerd2:ci RELEASE_ID="${GITHUB_SHA}"
      - name: Build amd64 and arm64 OCI archive
        run: make container-multi RELEASE_ID="${GITHUB_SHA}"
      - name: Build APK with abuild and its test suite
        run: make apk RELEASE_ID="${GITHUB_SHA}"
      - name: Generate temporary guest credentials
        run: |
          ssh-keygen -q -t ed25519 -N '' -C routerd2-ci -f "${RUNNER_TEMP}/routerd2-qemu"
          printf 'SSH_AUTHORIZED_KEY=%s\n' "$(cat "${RUNNER_TEMP}/routerd2-qemu.pub")" >> "${GITHUB_ENV}"
      - name: Assemble Linux appliance fixture
        run: make image IMAGE_CONFIG=qemu RELEASE_ID="${GITHUB_SHA}"
      - name: Boot real Linux and query the embedded SSH CLI
        run: make qemu-smoke QEMU_TIMEOUT=120 QEMU_SSH_KEY="${RUNNER_TEMP}/routerd2-qemu"
      - name: Verify native forwarding, ACL, NAT, DS-Lite, ECMP, links and HA guards
        run: make qemu-network QEMU_TIMEOUT=120
      - name: Verify kernel WireGuard IPv4/IPv6 traffic, peer replacement and ownership
        run: make qemu-wireguard
      - name: Verify learned RA DNS expiry and live updates
        run: make qemu-ra-dns
      - name: Verify RA client configuration and expiry through the real daemon
        run: make qemu-daemon
      - name: Verify AFTR resolution and expiry through the real daemon
        run: make qemu-daemon-aftr
      - name: Verify native protocols, SSH recovery, DHCP-to-DNS and BGP on the appliance kernel
        # Run the required packet/namespace gates on our Alpine kernel. Hosted
        # runner kernels may omit drivers such as VRF; no check is skipped.
        run: make qemu-protocols
      - name: Verify signed PID 1 release selection and confirmation
        run: make qemu-release-boot
      - name: Verify persistent configuration, SSH keys and release fallback across two boots
        run: make qemu-storage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-validation
          path: |
            dist/apk/
            dist/image/
            dist/network-test/
            dist/wireguard-test/
            dist/ra-dns-test/
            dist/daemon-test/
            dist/aftr-daemon-test/
            dist/daemon-management-test/
            dist/daemon-dhcp-dns-test/
            dist/daemon-bgp-test/
            dist/dhcp-test/
            dist/dhcp-server-test/
            dist/vrrp-test/
            dist/ra-client-test/
            dist/aftr-test/
            dist/release-boot-test/
            dist/storage-test/
            dist/routerd2.oci.tar
          if-no-files-found: warn
          retention-days: 7
