name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Format, test, race detector, and vet
        run: make check
      - name: Native Linux networking in an isolated namespace
        run: |
          # A child user namespace cannot request every host kernel module.
          # Load each required driver in the runner's initial user namespace;
          # a missing driver is a hard failure with its module name in the log.
          uname -r
          for module in veth bridge 8021q vrf vxlan macvlan nf_tables nft_ct nft_chain_nat nft_masq nft_nat nft_reject_inet nft_log nf_log_syslog ip6_tunnel; do
            sudo modprobe --verbose "$module"
          done
          CGO_ENABLED=0 go test -tags integration -c -o /tmp/routerd2-network.test ./internal/network
          sudo env ROUTERD2_INTEGRATION_REQUIRED=1 /tmp/routerd2-network.test -test.v
      - name: Static Linux builds
        run: make build-linux RELEASE_ID="${GITHUB_SHA}"
      - name: Signed release bundles from actual amd64 and arm64 binary pairs
        run: make release-built-test RELEASE_ID="${GITHUB_SHA}"
      - name: Integrated daemon, SSH, DHCP-to-DNS, BGP FIB and ownership expiry
        run: |
          CGO_ENABLED=0 go test -tags integration -c -o /tmp/routerd2-daemon.test ./internal/integration
          sudo env ROUTERD2_INTEGRATION_REQUIRED=1 ROUTERD2_TEST_BIN_DIR="$PWD/dist/bin/linux-amd64" /tmp/routerd2-daemon.test -test.v
      - name: Native DHCPv4, DHCPv6-PD and router advertisements
        run: |
          CGO_ENABLED=0 go test -tags integration -c -o /tmp/routerd2-dhcp.test ./internal/protocol/dhcp4
          sudo env ROUTERD2_INTEGRATION_REQUIRED=1 /tmp/routerd2-dhcp.test -test.v
      - name: Native RA lifetimes and AFTR DNS transport
        run: |
          for protocol in ra raclient aftr; do
            CGO_ENABLED=0 go test -tags integration -c -o "/tmp/routerd2-$protocol.test" "./internal/protocol/$protocol"
            sudo env ROUTERD2_INTEGRATION_REQUIRED=1 "/tmp/routerd2-$protocol.test" -test.v
          done
      - name: Native DHCP server leases, renewal, release, decline and recovery
        run: |
          CGO_ENABLED=0 go test -tags integration -c -o /tmp/routerd2-dhcpserver.test ./internal/protocol/dhcpserver
          sudo env ROUTERD2_INTEGRATION_REQUIRED=1 /tmp/routerd2-dhcpserver.test -test.v
      - name: Native IPv4 and IPv6 VRRP elections and failover
        run: |
          CGO_ENABLED=0 go test -tags integration -c -o /tmp/routerd2-vrrp.test ./internal/protocol/vrrp
          sudo env ROUTERD2_INTEGRATION_REQUIRED=1 /tmp/routerd2-vrrp.test -test.v
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            dist/bin/
            dist/licenses/
          if-no-files-found: error

  images:
    needs: go
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - uses: docker/setup-buildx-action@v3
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-system-x86 openssh-client
      - name: Build and exercise the scratch container
        run: make container-smoke CONTAINER_TAG=routerd2:ci RELEASE_ID="${GITHUB_SHA}"
      - name: Build amd64 and arm64 OCI archive
        run: make container-multi RELEASE_ID="${GITHUB_SHA}"
      - name: Build APK with abuild and its test suite
        run: make apk RELEASE_ID="${GITHUB_SHA}"
      - name: Generate temporary guest credentials
        run: |
          ssh-keygen -q -t ed25519 -N '' -C routerd2-ci -f "${RUNNER_TEMP}/routerd2-qemu"
          printf 'SSH_AUTHORIZED_KEY=%s\n' "$(cat "${RUNNER_TEMP}/routerd2-qemu.pub")" >> "${GITHUB_ENV}"
      - name: Assemble Linux appliance fixture
        run: make image IMAGE_CONFIG=qemu RELEASE_ID="${GITHUB_SHA}"
      - name: Boot real Linux and query the embedded SSH CLI
        run: make qemu-smoke QEMU_TIMEOUT=120 QEMU_SSH_KEY="${RUNNER_TEMP}/routerd2-qemu"
      - name: Verify native forwarding, ACL, NAT, DS-Lite, ECMP, links and HA guards
        run: make qemu-network QEMU_TIMEOUT=120
      - name: Verify learned RA DNS expiry and live updates
        run: make qemu-ra-dns
      - name: Verify RA client configuration and expiry through the real daemon
        run: make qemu-daemon
      - name: Verify AFTR resolution and expiry through the real daemon
        run: make qemu-daemon-aftr
      - name: Verify signed PID 1 release selection and confirmation
        run: make qemu-release-boot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-validation
          path: |
            dist/apk/
            dist/image/
            dist/network-test/
            dist/ra-dns-test/
            dist/daemon-test/
            dist/aftr-daemon-test/
            dist/release-boot-test/
            dist/routerd2.oci.tar
          if-no-files-found: warn
          retention-days: 7
