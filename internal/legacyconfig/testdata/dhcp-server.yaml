apiVersion: routerd.net/v1alpha1
kind: Router
metadata: {name: migration-dhcp}
spec:
  resources:
    - apiVersion: net.routerd.net/v1alpha1
      kind: Interface
      metadata: {name: lan}
      spec: {ifname: eth1, managed: true, adminUp: true}
    - apiVersion: net.routerd.net/v1alpha1
      kind: IPv4StaticAddress
      metadata: {name: gateway}
      spec: {interface: lan, address: 192.0.2.1/24}
    - apiVersion: net.routerd.net/v1alpha1
      kind: DHCPv4Server
      metadata: {name: lan-v4}
      spec:
        server: dnsmasq
        logDHCP: true
        interface: lan
        addressPool: {start: 192.0.2.100, end: 192.0.2.119, leaseTime: 2h}
        gateway: 192.0.2.254
        dnsServers: [192.0.2.53]
        ntpServerFrom: [{resource: IPv4StaticAddress/gateway, field: address}]
        domain: lab.example
        options: [{name: domain-search, value: "lab.example,corp.example"}]
        profiles:
          - name: voice
            addressPool: {start: 192.0.2.160, end: 192.0.2.169}
            netmask: 255.255.255.0
            gateway: 192.0.2.254
            dnsServers: [192.0.2.54]
            ntpServers: [192.0.2.123]
            options: [{name: mtu, value: "1400"}]
        scopes:
          - name: phones
            profileRef: voice
            match: {ouiPrefixes: ["02:aa:bb"]}
          - name: cameras
            addressPool: {start: 192.0.2.180, end: 192.0.2.189, leaseTime: 1d}
            match: {macAddresses: ["02:cc:00:00:00:01"]}
    - apiVersion: net.routerd.net/v1alpha1
      kind: DHCPv4Reservation
      metadata: {name: printer}
      spec:
        server: lan-v4
        macAddress: "02:00:00:00:00:50"
        ipAddress: 192.0.2.20
        hostname: printer
        options: [{name: mtu, value: "1450"}]
