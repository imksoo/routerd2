apiVersion: routerd.net/v1alpha1
kind: Router
metadata: {name: migration-dslite}
spec:
  resources:
    - apiVersion: net.routerd.net/v1alpha1
      kind: Interface
      metadata: {name: wan}
      spec: {ifname: eth0, managed: true, adminUp: true, mtu: 9000}
    - apiVersion: net.routerd.net/v1alpha1
      kind: VirtualAddress
      metadata: {name: outer}
      spec: {interface: wan, family: ipv6, mode: static, address: "2001:db8::2/128"}
    - apiVersion: net.routerd.net/v1alpha1
      kind: DSLiteTunnel
      metadata: {name: provider}
      spec:
        interface: wan
        tunnelName: ds0
        aftrIPv6: "2001:db8:ffff::1"
        localAddressSource: static
        localAddress: "2001:db8::2"
        encapsulationLimit: none
    - apiVersion: net.routerd.net/v1alpha1
      kind: IPv4Route
      metadata: {name: default4}
      spec:
        destination: 0.0.0.0/0
        deviceFrom: {resource: DSLiteTunnel/provider, field: device}
        gateway: 192.0.0.1
        metric: 50
