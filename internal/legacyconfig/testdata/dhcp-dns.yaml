apiVersion: routerd.net/v1alpha1
kind: Router
metadata: {name: migration-dhcp-dns}
spec:
  resources:
    - apiVersion: net.routerd.net/v1alpha1
      kind: Interface
      metadata: {name: lan}
      spec: {ifname: eth1, managed: true, adminUp: true}
    - apiVersion: net.routerd.net/v1alpha1
      kind: IPv4StaticAddress
      metadata: {name: gateway}
      spec: {interface: lan, address: 192.0.2.1/24}
    - apiVersion: net.routerd.net/v1alpha1
      kind: DHCPv4Server
      metadata: {name: lan-v4}
      spec:
        interface: lan
        addressPool: {start: 192.0.2.100, end: 192.0.2.120, leaseTime: 60s}
        gatewayFrom: {resource: IPv4StaticAddress/gateway, field: address}
        dnsServerFrom: [{resource: IPv4StaticAddress/gateway, field: address}]
        domainFrom: {resource: DNSZone/home, field: zone}
    - apiVersion: net.routerd.net/v1alpha1
      kind: DNSResolver
      metadata: {name: resolver}
      spec:
        listen:
          - name: lan
            addresses: [192.0.2.1]
            port: 53
            sources: [local]
    - apiVersion: net.routerd.net/v1alpha1
      kind: DNSZone
      metadata: {name: home}
      spec:
        zone: home.arpa
        ttl: 120
        records: [{hostname: gateway, ipv4: 192.0.2.1}]
        dhcpDerived: {sources: [DHCPv4Server/lan-v4], leaseFile: /var/lib/routerd/dnsmasq/dnsmasq.leases, ddns: true, ttl: 45}
        reverseZones: [{name: 2.0.192.in-addr.arpa}]
    - apiVersion: net.routerd.net/v1alpha1
      kind: DNSForwarder
      metadata: {name: local}
      spec: {resolver: resolver, match: [home.arpa], zoneRefs: [home]}
