apiVersion: routerd.net/v1alpha1
kind: Router
metadata: {name: migration-otlp}
spec:
  resources:
    - apiVersion: observability.routerd.net/v1alpha1
      kind: Telemetry
      metadata: {name: collector}
      spec:
        otlp: {endpoint: "http://127.0.0.1:4317", insecure: true}
        serviceNamespace: edge
        attributes: {site: laboratory}
        signals: [logs]
