apiVersion: routerd.net/v1alpha1
kind: Router
metadata: {name: imported-health}
spec:
  resources:
    - apiVersion: net.routerd.net/v1alpha1
      kind: Interface
      metadata: {name: wan-a}
      spec: {ifname: wan0, managed: true, adminUp: true}
    - apiVersion: net.routerd.net/v1alpha1
      kind: Interface
      metadata: {name: wan-b}
      spec: {ifname: wan1, managed: true, adminUp: true}
    - apiVersion: net.routerd.net/v1alpha1
      kind: HealthCheck
      metadata: {name: health-a}
      spec: {target: 198.51.100.10, protocol: tcp, port: 18080, interval: 500ms, timeout: 500ms, healthyThreshold: 2, unhealthyThreshold: 3}
    - apiVersion: net.routerd.net/v1alpha1
      kind: HealthCheck
      metadata: {name: health-b}
      spec: {target: 198.51.100.11, protocol: tcp, port: 18080, interval: 500ms, timeout: 500ms, healthyThreshold: 2, unhealthyThreshold: 3}
