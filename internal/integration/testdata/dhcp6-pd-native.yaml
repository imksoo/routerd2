schema_version: 2
resources:
  - id: interface/wan0
    interface: {name: wan0}
  - id: interface/lan0
    interface: {name: lan0}
  - id: lan-address
    address: {interface: lan0, cidr: 192.0.2.1/24}
  - id: forwarding
    forwarding: {ipv6: true}
  - id: firewall
    firewall:
      input: {policy: accept}
      forward:
        - {from: lan0, to: wan0}
  - id: service/wan-ra
    service:
      name: wan-ra
      ra_client:
        interface: wan0
        slaac: false
        default_route: true
        dns: true
  - id: service/wan-pd
    depends_on: [interface/wan0, interface/lan0]
    service:
      name: wan-pd
      dhcp6:
        interface: wan0
        iaid: 1
        request_prefix: true
        prefix_length: 60
        delegations:
          - {name: lan, interface: lan0, subnet_id: 0, host_id: 1}
          - {name: source-a, interface: wan0, subnet_id: 0, host_id: 33, prefix_length: 128}
          - {name: source-b, interface: wan0, subnet_id: 0, host_id: 34, prefix_length: 128}
  - id: service/lan-ra
    depends_on: [service/wan-pd]
    service:
      name: lan-ra
      ra:
        interface: lan0
        router_lifetime_seconds: 1800
        dns_lifetime_seconds: 1800
        other_config: true
        from:
          service: wan-pd
          delegation: lan
          use_learned_rdnss: true
          use_learned_dnssl: true
  - id: service/lan-info
    depends_on: [service/wan-pd]
    service:
      name: lan-info
      dhcp6_server:
        interface: lan0
        server_duid: "00030001020000000042"
        dns_from: [wan-pd]
        sntp_from: [wan-pd]
        search_from: [wan-pd]
        domain_search: [local.test]
        refresh_seconds: 43200
  - id: service/pd-console
    service:
      name: pd-console
      web_console:
        listen: "[::]:8080"
        base_path: /ops/
