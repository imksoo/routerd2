apiVersion: routerd.net/v1alpha1
kind: Router
metadata: {name: conditional-lan}
spec:
  resources:
    - apiVersion: net.routerd.net/v1alpha1
      kind: Interface
      metadata: {name: wan}
      spec: {ifname: wan0, role: wan, managed: true, adminUp: true}
    - apiVersion: net.routerd.net/v1alpha1
      kind: Interface
      metadata: {name: lan}
      spec: {ifname: lan0, managed: true, adminUp: true}
    - apiVersion: net.routerd.net/v1alpha1
      kind: IPv4StaticAddress
      metadata: {name: local}
      spec: {interface: lan, address: 192.0.2.2/24}
    - apiVersion: net.routerd.net/v1alpha1
      kind: VirtualAddress
      metadata: {name: gateway}
      spec:
        family: ipv4
        interface: lan
        address: 192.0.2.254
        mode: vrrp
        vrrp:
          virtualRouterID: 42
          priority: 100
          gracefulActivation:
            timeout: 5s
            readyWhen:
              state:
                DHCPv6PrefixDelegation/wan-pd.phase: {equals: Bound}
                IPv6DelegatedAddress/lan-address.phase: {equals: Applied}
                IPv6RouterAdvertisement/announcement.phase: {equals: Applied}
                IPv4StaticAddress/local.phase: {equals: Applied}
    - apiVersion: net.routerd.net/v1alpha1
      kind: DHCPv6PrefixDelegation
      metadata: {name: wan-pd}
      spec: {interface: wan, client: routerd, prefixLength: 60}
    - apiVersion: net.routerd.net/v1alpha1
      kind: IPv6DelegatedAddress
      metadata: {name: lan-address, ownerRefs: [{kind: DHCPv6PrefixDelegation, name: wan-pd}]}
      spec:
        prefixDelegation: wan-pd
        interface: lan
        subnetID: "0"
        addressSuffix: "::1"
        prefixLength: 64
        dependsOn: [{resource: DHCPv6PrefixDelegation/wan-pd, phase: Bound}]
    - apiVersion: net.routerd.net/v1alpha1
      kind: IPv6RouterAdvertisement
      metadata: {name: announcement, ownerRefs: [{kind: IPv6DelegatedAddress, name: lan-address}]}
      spec:
        interface: lan
        prefixFrom: {resource: IPv6DelegatedAddress/lan-address, field: address}
        rdnssFrom: [{resource: IPv6DelegatedAddress/lan-address, field: address}]
        dnsslFrom: [{resource: DNSZone/home, field: zone}]
        mFlag: false
        oFlag: true
        mtu: 1500
        prfPreference: high
        preferredLifetime: "3600"
        validLifetime: "7200"
        when: {state: {VirtualAddress/gateway.role: {equals: master}}}
        dependsOn: [{resource: IPv6DelegatedAddress/lan-address, phase: Applied}]
    - apiVersion: net.routerd.net/v1alpha1
      kind: DHCPv6Server
      metadata: {name: information, ownerRefs: [{kind: IPv6DelegatedAddress, name: lan-address}]}
      spec:
        interface: lan
        mode: stateless
        logDHCP: true
        leaseTime: 12h
        stickyHoldDays: 3
        dnsServerFrom: [{resource: IPv6DelegatedAddress/lan-address, field: address}]
        domainSearchFrom: [{resource: DNSZone/home, field: zone}]
        when: {state: {VirtualAddress/gateway.role: {equals: master}}}
        dependsOn: [{resource: IPv6DelegatedAddress/lan-address, phase: Applied}]
    - apiVersion: net.routerd.net/v1alpha1
      kind: DNSResolver
      metadata: {name: resolver, ownerRefs: [{kind: IPv6DelegatedAddress, name: lan-address}]}
      spec:
        listen:
          - name: local
            addresses: ["127.0.0.1"]
            addressFrom:
              - {resource: Interface/lan, field: ipv4Addresses}
              - {resource: VirtualAddress/gateway, field: address}
              - {resource: IPv6DelegatedAddress/lan-address, field: address}
            port: 53
            sources: [local, learned, bootstrap]
    - apiVersion: net.routerd.net/v1alpha1
      kind: DNSZone
      metadata: {name: home}
      spec: {zone: home.test, records: [{hostname: destination, ipv6: "2001:db8:ffff::9"}]}
    - apiVersion: net.routerd.net/v1alpha1
      kind: DNSForwarder
      metadata: {name: local}
      spec: {resolver: DNSResolver/resolver, match: [home.test], zoneRefs: [DNSZone/home]}
    - apiVersion: system.routerd.net/v1alpha1
      kind: Sysctl
      metadata: {name: forwarding}
      spec: {key: net.ipv6.conf.all.forwarding, value: "1"}

    - apiVersion: net.routerd.net/v1alpha1
      kind: DNSUpstream
      metadata: {name: learned}
      spec:
        protocol: udp
        addressFrom: [{resource: DHCPv6PrefixDelegation/wan-pd, field: dnsServers}]
    - apiVersion: net.routerd.net/v1alpha1
      kind: DNSForwarder
      metadata: {name: learned}
      spec: {resolver: DNSResolver/resolver, match: [learned.test], upstreams: [DNSUpstream/learned]}
    - apiVersion: net.routerd.net/v1alpha1
      kind: DNSUpstream
      metadata: {name: bootstrap}
      spec:
        protocol: udp
        address: peer.provider.test
        bootstrapFrom: [{resource: DHCPv6PrefixDelegation/wan-pd, field: dnsServers}]
    - apiVersion: net.routerd.net/v1alpha1
      kind: DNSForwarder
      metadata: {name: bootstrap}
      spec: {resolver: DNSResolver/resolver, match: [boot.test], upstreams: [DNSUpstream/bootstrap]}
