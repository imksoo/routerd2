apiVersion: routerd.net/v1alpha1
kind: Router
metadata: {name: imported-pd-lan}
spec:
  resources:
    - apiVersion: net.routerd.net/v1alpha1
      kind: Interface
      metadata: {name: wan}
      spec: {ifname: wan0, managed: true, adminUp: true}
    - apiVersion: net.routerd.net/v1alpha1
      kind: Interface
      metadata: {name: lan}
      spec: {ifname: lan0, managed: true, adminUp: true}
    - apiVersion: net.routerd.net/v1alpha1
      kind: DHCPv6PrefixDelegation
      metadata: {name: wan-pd}
      spec: {interface: wan, client: routerd, prefixLength: 60}
    - apiVersion: net.routerd.net/v1alpha1
      kind: DHCPv6Information
      metadata: {name: wan-info}
      spec: {interface: wan}
    - apiVersion: net.routerd.net/v1alpha1
      kind: IPv6DelegatedAddress
      metadata: {name: lan-address}
      spec: {prefixDelegation: DHCPv6PrefixDelegation/wan-pd, interface: lan, subnetID: "0", addressSuffix: "::1", prefixLength: 64, sendRA: true, announce: true}
    - apiVersion: net.routerd.net/v1alpha1
      kind: DHCPv6Server
      metadata: {name: lan-info}
      spec:
        server: dnsmasq
        interface: lan
        mode: stateless
        domainSearch: [local.test]
        dnsServerFrom: [{resource: DHCPv6Information/wan-info, field: dnsServers}]
        sntpServerFrom: [{resource: DHCPv6PrefixDelegation/wan-pd, field: sntpServers}]
        domainSearchFrom: [{resource: DHCPv6Information/wan-info, field: domainSearch}]
    - apiVersion: net.routerd.net/v1alpha1
      kind: IPv6DelegatedAddress
      metadata: {name: wan-source-a}
      spec: {prefixDelegation: DHCPv6PrefixDelegation/wan-pd, interface: wan, subnetID: "0", addressSuffix: "::21", prefixLength: 128}
    - apiVersion: net.routerd.net/v1alpha1
      kind: IPv6DelegatedAddress
      metadata: {name: wan-source-b}
      spec: {prefixDelegation: DHCPv6PrefixDelegation/wan-pd, interface: wan, subnetID: "0", addressSuffix: "::22", prefixLength: 128}
    - apiVersion: system.routerd.net/v1alpha1
      kind: Sysctl
      metadata: {name: forwarding-v6}
      spec: {key: net.ipv6.conf.all.forwarding, value: "1"}
    - apiVersion: firewall.routerd.net/v1alpha1
      kind: FirewallZone
      metadata: {name: lan-edge}
      spec: {role: untrust, interfaces: [Interface/lan]}
    - apiVersion: firewall.routerd.net/v1alpha1
      kind: FirewallZone
      metadata: {name: wan-peer}
      spec: {role: trust, interfaces: [Interface/wan]}
    - apiVersion: firewall.routerd.net/v1alpha1
      kind: FirewallRule
      metadata: {name: deny-lan-self}
      spec: {fromZone: lan-edge, toZone: self, action: drop}
    - apiVersion: firewall.routerd.net/v1alpha1
      kind: FirewallRule
      metadata: {name: allow-lan-wan}
      spec: {fromZone: lan-edge, toZone: wan-peer, action: accept}
