# Public, isolated addresses. Retains homert's one static server fragment and
# master-only learned client/fallback fragment; does not contain live settings.
apiVersion: routerd.net/v1alpha1
kind: Router
metadata: {name: imported-time}
spec:
  resources:
    - apiVersion: net.routerd.net/v1alpha1
      kind: Interface
      metadata: {name: wan}
      spec: {ifname: wan0, managed: true, adminUp: true}
    - apiVersion: net.routerd.net/v1alpha1
      kind: Interface
      metadata: {name: lan}
      spec: {ifname: lan0, managed: true, adminUp: true}
    - apiVersion: net.routerd.net/v1alpha1
      kind: IPv4StaticAddress
      metadata: {name: wan4}
      spec: {interface: wan, address: 192.0.2.1/24}
    - apiVersion: net.routerd.net/v1alpha1
      kind: IPv4StaticAddress
      metadata: {name: lan4}
      spec: {interface: lan, address: 198.51.100.1/24}
    - apiVersion: net.routerd.net/v1alpha1
      kind: VirtualAddress
      metadata: {name: wan6}
      spec: {family: ipv6, interface: wan, address: '2001:db8:123::1/128'}
    - apiVersion: net.routerd.net/v1alpha1
      kind: VirtualAddress
      metadata: {name: lan6}
      spec: {family: ipv6, interface: lan, address: '2001:db8:456::1/128'}
    - apiVersion: net.routerd.net/v1alpha1
      kind: IPv6StaticRoute
      metadata: {name: wan6-route}
      spec: {destination: '2001:db8:123::/64', interface: wan}
    - apiVersion: net.routerd.net/v1alpha1
      kind: IPv6StaticRoute
      metadata: {name: lan6-route}
      spec: {destination: '2001:db8:456::/64', interface: lan}
    - apiVersion: net.routerd.net/v1alpha1
      kind: VirtualAddress
      metadata: {name: gateway}
      spec:
        family: ipv4
        interface: lan
        address: 198.51.100.100/32
        mode: vrrp
        vrrp: {virtualRouterID: 42, priority: 100, peers: [198.51.100.2], preempt: true}
    - apiVersion: net.routerd.net/v1alpha1
      kind: DHCPv6PrefixDelegation
      metadata: {name: wan-pd}
      spec:
        interface: wan
        prefixLength: 60
        when: {state: {VirtualAddress/gateway.role: {equals: master}}}
    - apiVersion: net.routerd.net/v1alpha1
      kind: DHCPv6Information
      metadata: {name: wan-info}
      spec:
        interface: wan
        request: [sntp-servers]
        when: {state: {VirtualAddress/gateway.role: {equals: master}}}
    - apiVersion: net.routerd.net/v1alpha1
      kind: DNSResolver
      metadata: {name: resolver}
      spec:
        listen: [{name: lan, addresses: [198.51.100.1], port: 53, sources: [time]}]
    - apiVersion: net.routerd.net/v1alpha1
      kind: DNSZone
      metadata: {name: time}
      spec:
        zone: ntp.test
        records: [{hostname: clock, ipv4: 192.0.2.4}]
    - apiVersion: net.routerd.net/v1alpha1
      kind: DNSForwarder
      metadata: {name: time}
      spec: {resolver: DNSResolver/resolver, match: [ntp.test], zoneRefs: [DNSZone/time]}
    - apiVersion: system.routerd.net/v1alpha1
      kind: NTPServer
      metadata: {name: lan-time}
      spec:
        provider: chrony
        managed: true
        source: static
        servers: [192.0.2.2, '2001:db8:123::3', clock.ntp.test]
        listenAddressFrom: [{resource: IPv4StaticAddress/lan4, field: address}]
        allowCIDRs: [198.51.100.0/24]
    - apiVersion: system.routerd.net/v1alpha1
      kind: NTPClient
      metadata: {name: system-time}
      spec:
        provider: chrony
        managed: true
        source: auto
        serverFrom: [{resource: DHCPv6Information/wan-info, field: sntpServers}]
        fallbackServers: [192.0.2.2, clock.ntp.test]
        when: {state: {VirtualAddress/gateway.role: {equals: master}}}
    - apiVersion: system.routerd.net/v1alpha1
      kind: Sysctl
      metadata: {name: forwarding4}
      spec: {key: net.ipv4.ip_forward, value: '1'}
    - apiVersion: system.routerd.net/v1alpha1
      kind: Sysctl
      metadata: {name: forwarding6}
      spec: {key: net.ipv6.conf.all.forwarding, value: '1'}
