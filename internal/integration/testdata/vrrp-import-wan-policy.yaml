schema_version: 1
vrrp:
  VirtualAddress/gateway:
    source_address: 192.0.2.2
    vip_interface: ha
ds_lite:
  DSLiteTunnel/provider:
    source_from: DHCPv6PrefixDelegation/wan-pd
    selection: first
    timeout_seconds: 2
    retry_seconds: 10
health_checks:
  HealthCheck/master-probe:
    interface: Interface/wan-identity
    source_address: 198.51.100.254
  HealthCheck/backup-probe:
    interface: Interface/lan
    source_address: 192.0.2.2
  HealthCheck/role-probe:
    interface: Interface/lan
    source_address: 192.0.2.2
